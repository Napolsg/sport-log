<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#081420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sport Log">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Sport Log</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#081420;--sf2:#32324a;
      --bd:#44445a;--ac:#a8d8a8;--ac2:#7ec8a0;--red:#e07a7a;
      --tx:#e8e8f0;--mu:#8888a8;--mono:'IBM Plex Mono',monospace;--r:8px;
      --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--mono);}
    .app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;}

    /* HEADER */
    .hdr{padding:calc(var(--safe-top) + 12px) 16px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--bg);}
    .hdr-l{display:flex;align-items:baseline;gap:8px;}
    .hdr h1{font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--ac);text-transform:uppercase;margin:0;}
    .ver{font-size:9px;color:var(--mu);}
    .sync-btn{background:transparent;border:1px solid var(--bd);color:var(--mu);font-family:var(--mono);font-size:10px;padding:4px 8px;border-radius:4px;cursor:pointer;}
    .sync-btn.syncing{color:var(--ac);border-color:var(--ac);}
    .sync-btn.error{color:var(--red);border-color:var(--red);}

    /* TABS */
    .tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;background:var(--bg);}
    .tab{flex:1;padding:10px 0;text-align:center;font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;font-family:var(--mono);}
    .tab.active{color:var(--ac);border-bottom-color:var(--ac);}

    /* CONTENT */
    .content{flex:1;overflow-y:auto;padding:14px 14px calc(var(--safe-bottom) + 14px);-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .content::-webkit-scrollbar{display:none;}

    /* SETUP */
    .setup{padding:32px 20px;display:flex;flex-direction:column;gap:16px;}
    .setup h2{font-size:14px;font-weight:600;color:var(--ac);letter-spacing:.08em;}
    .setup p{font-size:12px;color:var(--mu);line-height:1.7;}
    .setup input{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-family:var(--mono);font-size:13px;padding:10px 12px;border-radius:var(--r);width:100%;outline:none;}
    .setup input:focus{border-color:var(--ac2);}
    .setup input::placeholder{color:var(--mu);}
    .btn-primary{background:var(--ac);color:#1e1e2e;border:none;font-family:var(--mono);font-size:13px;font-weight:600;padding:12px;border-radius:var(--r);cursor:pointer;width:100%;}
    .btn-primary:active{opacity:.8;}
    .note{font-size:10px;color:var(--mu);line-height:1.6;}

    /* DATE */
    .day-label{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:11px;color:var(--mu);}
    .day-label input[type=date]{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:4px;outline:none;color-scheme:dark;}

    /* TIMER */
    .timer-bar{background:#0d2240;border:1px solid #1a4a7a;border-radius:var(--r);padding:10px 14px;margin-bottom:12px;--sf2:#1a3a5a;--bd:#2a5a8a;--mu:#4a8aaa;--tx:#c0d8f0;}
    .timer-top{display:flex;align-items:center;gap:8px;}
    .td-part{font-size:28px;font-weight:600;color:var(--ac);letter-spacing:0;font-variant-numeric:tabular-nums;font-family:var(--mono);}
    .td-part.run{color:var(--ac2);}
    .td-part.alr{color:var(--red);}
    .td-colon{font-size:28px;font-weight:600;color:var(--ac);line-height:1;}
    .td-colon.run{color:var(--ac2);}
    .td-colon.alr{color:var(--red);}
    .bt{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:4px;cursor:pointer;flex:1;}
    .bt.on{border-color:var(--ac);color:var(--ac);}
    .bt:active{background:#3a3a52;}
    .timer-sel{background:transparent;border:none;color:var(--ac);font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;padding:0;outline:none;color-scheme:dark;cursor:pointer;width:100px;height:40px;-webkit-appearance:none;appearance:none;}

    /* ADD EXO */
    .add-exo{display:flex;gap:8px;margin-bottom:14px;}
    .exo-wrap{flex:1;position:relative;min-width:0;z-index:100;}
    .add-exo input{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-family:var(--mono);font-size:13px;padding:10px 12px;border-radius:var(--r);width:100%;outline:none;}
    .add-exo input:focus{border-color:var(--ac2);}
    .add-exo input::placeholder{color:var(--mu);}
    .dropdown{position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);z-index:200;max-height:200px;overflow-y:auto;}
    .ddi{padding:11px 12px;font-size:13px;cursor:pointer;color:var(--tx);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
    .ddi:last-child{border-bottom:none;}
    .ddi:active{background:#3a3a52;}
    .ddi.new{color:var(--ac);font-style:italic;}
    .ddx{color:var(--mu);font-size:14px;padding:4px 10px;}
    .btn-acc{background:#3a4255;color:#a8b8d0;border:1px solid #505868;font-family:var(--mono);font-size:18px;font-weight:700;padding:10px 14px;border-radius:var(--r);cursor:pointer;flex-shrink:0;line-height:1;}
    .btn-acc:active{opacity:.8;}
    .save-st{font-size:11px;color:var(--ac2);text-align:right;min-height:0;margin-bottom:0;}

    /* EXO CARD */
    .exo-card{padding:8px 0;border-bottom:1px solid var(--bd);margin-bottom:0;}
    .exo-card:last-of-type{border-bottom:none;}
    .exo-row{display:flex;align-items:flex-start;gap:5px;}
    .exo-name-wrap{display:flex;align-items:center;gap:4px;flex:1;min-width:0;align-self:center;}
    .exo-chips-wrap{display:flex;align-items:center;gap:4px;}
    .exo-name{font-size:14px;font-weight:600;color:var(--tx);white-space:normal;word-break:break-word;line-height:1.3;}

    /* WEIGHT */
    .weight-input{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-family:var(--mono);font-size:13px;padding:4px 2px;border-radius:5px;width:36px;text-align:center;outline:none;flex-shrink:0;flex-grow:0;align-self:center;}
    .weight-input::-webkit-inner-spin-button,.weight-input::-webkit-outer-spin-button{-webkit-appearance:none;}
    .weight-input:focus{border-color:var(--ac2);}

    /* SERIES */
    .serie-chip-input{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-family:'IBM Plex Mono',monospace;font-size:16px;padding:3px 0;border-radius:5px;width:45px;text-align:center;text-align-last:center;outline:none;cursor:pointer;color-scheme:dark;-webkit-appearance:none;appearance:none;transform:scale(0.75);transform-origin:center;margin:0 -5px;}
    .serie-chip-wrap{display:inline-flex;flex-direction:column;align-items:center;gap:1px;}
    .serie-chip-num{font-size:8px;color:var(--mu);text-align:center;}
    .btn-del-serie{background:transparent;border:none;color:var(--mu);font-size:10px;cursor:pointer;padding:0;line-height:1;}
    .btn-del-serie:active{color:var(--red);}
    .btn-add-serie{background:transparent;border:1px dashed var(--bd);color:var(--mu);font-family:var(--mono);font-size:11px;padding:4px 5px;border-radius:5px;cursor:pointer;white-space:nowrap;}
    .btn-add-serie:active{border-color:var(--ac2);color:var(--ac);}
    .bdel{background:transparent;border:none;cursor:pointer;color:var(--mu);font-size:14px;padding:2px 4px;line-height:1;flex-shrink:0;align-self:center;}
    .bdel:active{color:var(--red);}

    /* PAST HISTORY */
    .past-section{margin-top:12px;}
    .past-day{background:#1e0e0e;border:1px solid #4a1a1a;border-radius:var(--r);padding:10px 12px;margin-bottom:8px;--sf2:#2a1818;--bd:#4a1a1a;--mu:#905050;--ac:#e07070;--tx:#e0c0c0;}
    .past-title{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--mu);text-transform:uppercase;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--bd);}
    .past-day-lbl{font-size:11px;font-weight:600;color:#e07070;margin-bottom:0;}

    /* HISTORY TABLE */
    .hist-day{background:#1e0e0e;border:1px solid #4a1a1a;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;--sf2:#2a1818;--bd:#4a1a1a;--mu:#905050;--ac:#e07070;--tx:#e0c0c0;}
    .hist-day-title{font-size:11px;font-weight:600;letter-spacing:.1em;color:#e07070;text-transform:uppercase;}
    .hist-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;table-layout:auto;}
    .hist-table tr{border-bottom:1px solid var(--bd);}
    .hist-table tr:last-child{border-bottom:none;}
    .ht-name{color:var(--tx);max-width:15ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 10px 5px 0;font-weight:600;width:99%;}
    .ht-kg{color:var(--mu);text-align:right;padding:5px 8px;white-space:nowrap;font-size:11px;width:4ch;}
    .ht-rep{color:var(--ac);text-align:right;padding:5px 6px;font-weight:600;width:3ch;white-space:nowrap;}

    /* STATS */
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
    .stat-card{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:14px 12px;}
    .stat-lbl{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
    .stat-val{font-size:26px;font-weight:600;color:var(--ac);}
    .sec-title{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;margin-top:18px;}
    .freq-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:12px;}
    .freq-row:last-child{border-bottom:none;}
    .freq-cnt{color:var(--ac);font-weight:600;}
    .exo-sel{margin-bottom:12px;}
    .exo-sel select{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:var(--r);width:100%;outline:none;color-scheme:dark;}
    .chart-wrap{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px;}
    .chart-title{font-size:11px;color:var(--tx);margin-bottom:12px;font-weight:500;}
    .chart-legend{display:flex;gap:12px;margin-top:10px;}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mu);}
    .legend-dot{width:10px;height:10px;border-radius:2px;}

    .session-card{background:#161a20;border:1px solid #282e38;border-radius:var(--r);padding:8px 14px 12px;margin-bottom:12px;--sf2:#202530;--bd:#303848;--mu:#606878;--tx:#c8d0dc;}
    .empty{text-align:center;color:var(--mu);font-size:12px;padding:24px 20px 8px;line-height:1.8;}
    .copy-wrap{margin:8px 0;}
    .copy-select{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--ac);font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:var(--r);outline:none;cursor:pointer;color-scheme:dark;-webkit-appearance:none;appearance:none;}
    .btn-fin{display:block;width:100%;margin-top:12px;background:#3a4255;color:#a8b8d0;border:1px solid #505868;font-family:var(--mono);font-size:12px;font-weight:600;padding:8px;border-radius:var(--r);cursor:pointer;letter-spacing:.06em;}
    .btn-fin:active{opacity:.8;}
    .arch-card{background:#0d2818;border:1px solid #2a7a50;border-radius:var(--r);--sf2:#1a4030;--bd:#2a7a50;--mu:#5a9a70;--ac:#5ad4a0;--tx:#c0e8d0;}
    .arch-title{font-size:11px;font-weight:600;color:#5ad4a0;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #1a4a30;}
    .btn-reopen{margin-top:10px;background:transparent;border:1px solid var(--bd);color:var(--mu);font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:4px;cursor:pointer;}
    .btn-reopen:active{border-color:var(--ac);color:var(--ac);}
    .hist-day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #3a1818;}
    .btn-del-day{background:transparent;border:none;color:#905050;font-family:var(--mono);font-size:14px;cursor:pointer;padding:0 2px;line-height:1;}
    .btn-del-day:active{color:var(--red);}
    .prog-section{margin-bottom:18px;}
    .prog-title{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--mu);text-transform:uppercase;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--bd);}
    .prog-card{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;}
    .prog-card-title{font-size:12px;font-weight:600;color:var(--ac);margin-bottom:8px;letter-spacing:.05em;}
    .prog-exo{display:flex;align-items:baseline;gap:6px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px;}
    .prog-exo:last-child{border-bottom:none;}
    .prog-exo-num{color:var(--mu);font-size:10px;flex-shrink:0;width:12px;}
    .prog-exo-name{color:var(--tx);flex:1;}
    .prog-exo-sets{color:var(--ac);font-size:11px;flex-shrink:0;}
    .prog-rest{font-size:10px;color:var(--mu);margin-top:8px;padding-top:6px;border-top:1px solid var(--bd);}
    .prog-alt{font-size:10px;color:var(--ac2);font-style:italic;margin-bottom:12px;line-height:1.6;}
    .prog-day-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
    .prog-day-label{font-size:13px;font-weight:600;color:var(--tx);}
    .prog-day-type{font-size:10px;color:var(--mu);}
  </style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-l"><h1>Sport Log</h1><span class="ver">v17.1</span></div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="sync-btn" id="sync-btn" onclick="syncNow()">↑↓ sync</button>
      <button class="sync-btn" onclick="resetToken()">token</button>
      <button class="sync-btn" onclick="forceUpdate()">maj</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-log" onclick="showTab('log')">Log</div>
    <div class="tab" id="tab-history" onclick="showTab('history')">Historique</div>
    <div class="tab" id="tab-stats" onclick="showTab('stats')">Stats</div>
    <div class="tab" id="tab-prog" onclick="showTab('prog')">Programme</div>
  </div>
  <div class="content" id="content"></div>
</div>
<script>
const OWNER='napolsg',REPO='sport-log',FILE='data.json';
const DAYS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MONTHS=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
let sessions={},savedExos=[],customTemplates={},currentDate=todayKey(),activeTab='log',saveTimer=null,activeStatsType=null;
let tInterval=null,tSecs=90,tRunning=false,tTarget=90,activeStatsExo=null,tStartTime=null,tStartSecs=90;
let ghToken=null,fileSha=null,syncing=false;

function todayKey(){return new Date().toISOString().slice(0,10);}
function fmtKey(k){const d=new Date(k+'T12:00:00');return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();}
function fmtS(k){const d=new Date(k+'T12:00:00');return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getSess(d){if(!sessions[d])sessions[d]={exercises:[]};return sessions[d];}

function loadLocal(){
  try{const r=localStorage.getItem('sl_v4');if(r){const p=JSON.parse(r);sessions=p.sessions||{};savedExos=p.savedExos||[];fileSha=p.fileSha||null;customTemplates=p.customTemplates||{};}}catch(e){}
  ghToken=localStorage.getItem('sl_token');
}
function saveLocal(){try{localStorage.setItem('sl_v4',JSON.stringify({sessions,savedExos,fileSha,customTemplates}));}catch(e){}}
function scheduleSave(){
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{saveLocal();autoSync();},800);
}

async function syncNow(){
  if(!ghToken||ghToken==='SKIP'){render();return;}
  if(syncing)return;
  setSyncState('syncing','↻ sync...');
  try{
    const res=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+FILE,{
      headers:{'Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json'}
    });
    if(res.ok){
      const json=await res.json();
      fileSha=json.sha;
      const remote=JSON.parse(atob(json.content.replace(/\n/g,'')));
      // Local wins: merge remote first, then overlay all local sessions
      const merged=Object.assign({},remote.sessions||{},sessions);
      sessions=merged;
      savedExos=Array.from(new Set([...(remote.savedExos||[]),...savedExos]));
      customTemplates=Object.assign({},remote.customTemplates||{},customTemplates);
    } else if(res.status!==404){throw new Error('HTTP '+res.status);}
    await pushToGitHub();
    setSyncState('ok','↑↓ sync');
    saveLocal();render();
  }catch(e){setSyncState('error','! erreur');setTimeout(()=>setSyncState('ok','↑↓ sync'),3000);}
}
async function autoSync(){if(!ghToken||ghToken==='SKIP'||syncing)return;await pushToGitHub();}
async function pushToGitHub(){
  if(!ghToken||ghToken==='SKIP')return;
  syncing=true;setSyncState('syncing','... sync');
  try{
    const content=btoa(unescape(encodeURIComponent(JSON.stringify({sessions,savedExos,customTemplates},null,2))));
    const body={message:'update',content};if(fileSha)body.sha=fileSha;
    const res=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+FILE,{
      method:'PUT',headers:{'Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(!res.ok)throw new Error('HTTP '+res.status);
    const json=await res.json();fileSha=json.content.sha;saveLocal();setSyncState('ok','↑↓ sync');
  }catch(e){setSyncState('error','! erreur');setTimeout(()=>setSyncState('ok','↑↓ sync'),3000);}
  syncing=false;
}
function setSyncState(state,label){const btn=document.getElementById('sync-btn');if(!btn)return;btn.textContent=label;btn.className='sync-btn'+(state==='syncing'?' syncing':state==='error'?' error':'');}

function renderSetup(){
  const c=document.getElementById('content');c.innerHTML='';
  const div=document.createElement('div');div.className='setup';
  div.innerHTML='<h2>CONFIGURATION</h2><p>Entre ton token GitHub pour sauvegarder les donnees sur le repo sport-log.</p><input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off"><button class="btn-primary" onclick="saveToken()">Enregistrer et synchroniser</button><p class="note">Token stocke uniquement sur cet appareil. Droits repo requis.</p><div style="text-align:center"><button style="background:transparent;border:none;color:var(--mu);font-family:var(--mono);font-size:11px;cursor:pointer;text-decoration:underline;margin-top:8px" onclick="skipSetup()">Continuer sans sync</button></div>';
  c.appendChild(div);
}
function saveToken(){const val=document.getElementById('token-input').value.trim();if(!val)return;ghToken=val;localStorage.setItem('sl_token',val);syncNow();}
function skipSetup(){localStorage.setItem('sl_token','SKIP');ghToken='SKIP';showTab('log');}
function resetToken(){if(!confirm('Reinitialiser le token ?'))return;localStorage.removeItem('sl_token');ghToken=null;render();}

function showTab(t){activeTab=t;['log','history','stats','prog'].forEach(id=>document.getElementById('tab-'+id).classList.toggle('active',id===t));render();}
function render(){
  if(!ghToken){renderSetup();return;}
  if(activeTab==='log')renderLog();
  else if(activeTab==='history')renderHistory();
  else if(activeTab==='stats')renderStats();
  else renderProg();
}

function tFmt(s){const m=Math.floor(Math.abs(s)/60),sc=Math.abs(s)%60;return String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');}
function startTimer(target){
  stopTimer();
  tTarget=target;tSecs=target;tStartTime=Date.now();tStartSecs=target;
  updT();
  tRunning=true;
  tInterval=setInterval(()=>{
    const elapsed=Math.floor((Date.now()-tStartTime)/1000);
    tSecs=Math.max(0,tStartSecs-elapsed);
    updT();
    if(_audioCtx&&_audioCtx.state==='suspended')_audioCtx.resume();
    if(tSecs<=0){beep();if(navigator.vibrate)navigator.vibrate([200,100,200,100,400]);stopTimer();}
  },500);
  updTimerBtns();
}
function stopTimer(){tRunning=false;clearInterval(tInterval);updTimerBtns();}
function resetTimer(){stopTimer();tSecs=tTarget;updT();}
function updT(){
  const mEl=document.getElementById('td-min'),sEl=document.getElementById('td-sec'),sel=document.getElementById('timer-sel'),colon=document.getElementById('td-colon');
  if(!mEl||!sEl)return;
  const s=Math.max(0,tSecs);
  mEl.textContent=String(Math.floor(s/60)).padStart(2,'0');
  sEl.textContent=String(s%60).padStart(2,'0');
  const cls='td-part'+(tRunning?' run':'')+(tSecs<=5&&tRunning?' alr':'');
  mEl.className=cls;sEl.className=cls;
  if(colon)colon.className='td-colon'+(tRunning?' run':'')+(tSecs<=5&&tRunning?' alr':'');
  if(sel){sel.style.display=tRunning?'none':'block';}
  mEl.style.display=tRunning?'inline':'none';
  sEl.style.display=tRunning?'inline':'none';
  if(colon)colon.style.display=tRunning?'inline':'none';
}
function updTimerBtns(){
  const bs=document.getElementById('bt-s'),br=document.getElementById('bt-r');
  if(bs)bs.className='bt'+(tRunning?' on':'');
  if(br)br.className='bt';
}
let _audioCtx=null;
function getAudioCtx(){
  // Always create fresh context if none or closed
  if(!_audioCtx||_audioCtx.state==='closed'){
    _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }
  return _audioCtx;
}
function unlockAudio(){
  try{
    const c=getAudioCtx();
    if(c.state==='suspended')c.resume();
    const buf=c.createBuffer(1,1,22050);
    const src=c.createBufferSource();src.buffer=buf;src.connect(c.destination);src.start(0);
  }catch(e){}
}
document.addEventListener('touchstart',unlockAudio,{passive:true});
function beep(){
  try{
    const c=getAudioCtx();
    const play=()=>{
      const now=c.currentTime;
      [[880,0],[1100,0.4],[1320,0.8]].forEach(([freq,t])=>{
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.frequency.value=freq;o.type='sine';
        g.gain.setValueAtTime(0,now+t);
        g.gain.linearRampToValueAtTime(0.5,now+t+0.05);
        g.gain.exponentialRampToValueAtTime(0.001,now+t+0.4);
        o.start(now+t);o.stop(now+t+0.4);
      });
    };
    if(c.state==='suspended'){c.resume().then(play);}else{play();}
  }catch(e){console.warn('beep',e);}
}

  row.appendChild(displayZone);row.appendChild(bStart);row.appendChild(bReset);

}

function updDD(){

  dd.style.display='block';dd.innerHTML='';
  matches.forEach(name=>{
    const item=document.createElement('div');item.className='ddi';
    item.innerHTML='<span>'+esc(name)+'</span><span class="ddx">✕</span>';
    ['mousedown','touchstart'].forEach(ev=>{
      item.querySelector('.ddx').addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();savedExos=savedExos.filter(x=>x!==name);updDD();});
      item.addEventListener(ev,e=>{if(e.target.classList.contains('ddx'))return;e.preventDefault();inp.value=name;hideDD();addExo();});

function addExo(){

function exportHistory(){
  const keys=Object.keys(sessions).filter(k=>sessions[k].exercises&&sessions[k].exercises.length>0).sort((a,b)=>a.localeCompare(b));
  if(keys.length===0)return;

  // Build CSV
  const maxSeries=Math.max(...keys.flatMap(k=>sessions[k].exercises.map(e=>e.series.length)));
  const headers=['Date','Type','Exercice','Poids (kg)'];
  for(let i=1;i<=maxSeries;i++)headers.push('Série '+i);
  const rows=[headers];

  keys.forEach(k=>{
    const s=sessions[k];
    const date=fmtKey(k);
    const type=s.type||'';
    s.exercises.forEach(exo=>{
      const row=[date,type,exo.name,exo.kg||''];
      for(let i=0;i<maxSeries;i++)row.push(exo.series[i]?exo.series[i].reps||'':'');
      rows.push(row);
    });
  });

  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const bom='\uFEFF'; // UTF-8 BOM for Excel
  const blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='sport-log-'+todayKey()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function renderHistory(){
  const c=document.getElementById('content');c.innerHTML='';
  const keys=Object.keys(sessions).filter(k=>sessions[k].exercises&&sessions[k].exercises.length>0).sort((a,b)=>b.localeCompare(a));
  if(keys.length===0){c.innerHTML='<div class="empty">Aucune séance enregistrée.</div>';return;}

  const expBtn=document.createElement('button');
  expBtn.className='btn-reopen';expBtn.style.cssText='width:100%;margin-bottom:12px;';
  expBtn.textContent='⬇ Exporter en CSV (Excel)';
  expBtn.onclick=exportHistory;
  c.appendChild(expBtn);
  keys.forEach(k=>{
    const block=document.createElement('div');block.className='hist-day session-card';
    const hdr=document.createElement('div');hdr.className='hist-day-header';
    const ttl=document.createElement('span');ttl.className='hist-day-title';
    ttl.textContent=fmtKey(k)+(sessions[k].type?' — '+sessions[k].type:'');
    const delDay=document.createElement('button');delDay.className='btn-del-day';delDay.textContent='✕';
    delDay.addEventListener('click',()=>{delete sessions[k];scheduleSave();renderHistory();});
    hdr.appendChild(ttl);hdr.appendChild(delDay);
    block.appendChild(hdr);
    const maxS3=Math.max(1,...sessions[k].exercises.map(e=>e.series.length));
    let t='<table class="hist-table">';
    sessions[k].exercises.forEach(exo=>{
      t+='<tr><td class="ht-name">'+esc(exo.name)+'</td><td class="ht-kg">'+(exo.kg?exo.kg+'kg':'')+'</td>';
      for(let si=0;si<maxS3;si++){t+='<td class="ht-rep">'+(exo.series[si]?(exo.series[si].reps||'—'):'')+'</td>';}
      t+='</tr>';
    });
    t+='</table>';
    const tbl=document.createElement('div');tbl.innerHTML=t;block.appendChild(tbl);
    c.appendChild(block);
  });
}

function renderStats(){
  const c=document.getElementById('content');c.innerHTML='';
  const keys=Object.keys(sessions).filter(k=>sessions[k].exercises&&sessions[k].exercises.length>0);
  let totalSeries=0,totalReps=0;const exoCount={};
  keys.forEach(k=>{sessions[k].exercises.forEach(exo=>{exoCount[exo.name]=(exoCount[exo.name]||0)+1;exo.series.forEach(s=>{totalSeries++;if(s.reps)totalReps+=parseInt(s.reps)||0;});});});
  const g=document.createElement('div');g.className='stat-grid';
  g.innerHTML='<div class="stat-card"><div class="stat-lbl">Séances</div><div class="stat-val">'+keys.length+'</div></div><div class="stat-card"><div class="stat-lbl">Séries</div><div class="stat-val">'+totalSeries+'</div></div><div class="stat-card"><div class="stat-lbl">Répétitions</div><div class="stat-val">'+totalReps+'</div></div><div class="stat-card"><div class="stat-lbl">Exercices</div><div class="stat-val">'+Object.keys(exoCount).length+'</div></div>';
  c.appendChild(g);

  // Session type stats
  const typeTitle=document.createElement('div');typeTitle.className='sec-title';typeTitle.textContent='Progression par type de séance';c.appendChild(typeTitle);

  // Gather all session types
  const typeMap={};
  keys.forEach(k=>{
    const t=sessions[k].type;
    if(t){if(!typeMap[t])typeMap[t]=[];typeMap[t].push(k);}
  });

  if(Object.keys(typeMap).length===0){
    const em=document.createElement('div');em.className='empty';em.textContent='Aucune séance étiquetée. Chargez un template ou renseignez le champ "Type" lors de votre prochaine séance.';c.appendChild(em);
  } else {
    const sw=document.createElement('div');sw.className='exo-sel';
    const selT=document.createElement('select');selT.id='st';
    selT.innerHTML='<option value="">-- Choisir un type --</option>'+Object.keys(typeMap).sort().map(t=>'<option value="'+esc(t)+'"'+(t===activeStatsType?' selected':'')+'>'+esc(t)+' ('+typeMap[t].length+'x)</option>').join('');
    selT.style.cssText='background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:var(--r);width:100%;outline:none;color-scheme:dark;';
    sw.appendChild(selT);c.appendChild(sw);
    const ca=document.createElement('div');ca.id='ca';c.appendChild(ca);
    selT.addEventListener('change',e=>{activeStatsType=e.target.value;renderSessionTypeChart(activeStatsType,typeMap);});
    if(activeStatsType&&typeMap[activeStatsType])renderSessionTypeChart(activeStatsType,typeMap);
  }

  // Exercise frequency
  const topExo=Object.entries(exoCount).sort((a,b)=>b[1]-a[1]);
  if(topExo.length>0){
    const ft=document.createElement('div');ft.className='sec-title';ft.textContent='Exercices fréquents';c.appendChild(ft);
    topExo.slice(0,10).forEach(([n,v])=>{const r=document.createElement('div');r.className='freq-row';r.innerHTML='<span>'+esc(n)+'</span><span class="freq-cnt">'+v+'x</span>';c.appendChild(r);});
  }
}

function renderSessionTypeChart(type,typeMap){
  const area=document.getElementById('ca');if(!area||!type||!typeMap[type])return;area.innerHTML='';
  const keys=typeMap[type].sort((a,b)=>a.localeCompare(b));
  if(keys.length<2){
    area.innerHTML='<div class="empty" style="padding:12px">Pas encore assez de séances de ce type pour afficher une progression.</div>';return;
  }

  // Get all exercises that appear in at least one session of this type
  const exoNames=[];
  keys.forEach(k=>{sessions[k].exercises.forEach(e=>{if(!exoNames.includes(e.name))exoNames.push(e.name);});});

  // One chart per exercise
  exoNames.forEach(name=>{
    let anyKg=false;
    const pts=keys.map(k=>{
      const exo=sessions[k].exercises.find(e=>e.name===name);
      if(!exo)return null;
      if(exo.kg)anyKg=true;
      const tot=exo.series.reduce((s,r)=>s+(parseInt(r.reps)||0),0);
      const mx=Math.max(...exo.series.map(r=>parseInt(r.reps)||0));
      return{date:fmtS(k),tot,mx,kg:exo.kg||''};
    }).filter(Boolean);
    if(pts.length===0)return;

    const W=320,H=118,PL=28,PR=10,PT=20,PB=28,cW=W-PL-PR,cH=H-PT-PB;
    const maxVal=Math.max(...pts.map(d=>d.tot),1);
    const barW=Math.min(28,cW/pts.length*0.6),step=cW/pts.length;
    let bars='',line='',dots='',labels='',yAxis='',kgLabels='';
    pts.forEach((d,i)=>{
      const x=PL+i*step+step/2,bH=(d.tot/maxVal)*cH;
      bars+='<rect x="'+(x-barW/2).toFixed(1)+'" y="'+(PT+cH-bH).toFixed(1)+'" width="'+barW+'" height="'+bH.toFixed(1)+'" rx="3" fill="rgba(168,216,168,0.35)" stroke="#a8d8a8" stroke-width="1"/>';
      const dy=(PT+cH-(d.mx/maxVal)*cH).toFixed(1);
      if(i===0)line+='M'+x.toFixed(1)+','+dy;else line+=' L'+x.toFixed(1)+','+dy;
      dots+='<circle cx="'+x.toFixed(1)+'" cy="'+dy+'" r="3" fill="#e07a7a"/>';
      labels+='<text x="'+x.toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" fill="#8888a8" font-size="7" font-family="monospace">'+esc(d.date)+'</text>';
      if(d.kg)kgLabels+='<text x="'+x.toFixed(1)+'" y="'+(PT-6)+'" text-anchor="middle" fill="#d0a860" font-size="8" font-family="monospace" font-weight="600">'+esc(d.kg)+'kg</text>';
    });
    for(let i=0;i<=3;i++){const y=(PT+cH*(1-i/3)).toFixed(1),val=Math.round(maxVal*i/3);yAxis+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="rgba(255,255,255,0.05)" stroke-width="1"/><text x="'+(PL-3)+'" y="'+(parseFloat(y)+3).toFixed(1)+'" text-anchor="end" fill="#8888a8" font-size="7" font-family="monospace">'+val+'</text>';}
    const wrap=document.createElement('div');wrap.className='chart-wrap';wrap.style.marginBottom='10px';
    wrap.innerHTML='<div class="chart-title">'+esc(name)+'</div><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px;display:block;">'+yAxis+bars+'<path d="'+line+'" fill="none" stroke="#e07a7a" stroke-width="1.5"/>'+dots+kgLabels+labels+'</svg>';
    area.appendChild(wrap);
  });
}

function forceUpdate(){
  const reload=()=>{location.href=location.href.split('?')[0]+'?v='+Date.now();};
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs=>{
      Promise.all(regs.map(r=>r.unregister())).then(()=>{
        caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).then(reload).catch(reload);
      }).catch(reload);
    }).catch(reload);
  } else {
    reload();
  }
}

function renderProg(){
  const c=document.getElementById('content');c.innerHTML='';

  // Séances type
  const seances={
    'A':{label:'Séance A',sub:'Priorité tirage — prise pronation',exos:[['Traction pronation','3x Max'],['Dips','3x Max'],['Tirage horizontal','3x Max'],['Pompes pieds levés','3x Max']],rest:'2 min entre séries / 3 min entre exercices'},
    'B':{label:'Séance B',sub:'Priorité poussée — prise supination',exos:[['Pompes pieds levés','3x Max'],['Tirage horizontal','3x Max'],['Dips','3x Max'],['Traction supination','3x Max']],rest:'2 min entre séries / 3 min entre exercices'},
    'AE':{label:'Séance A — Élastique',sub:'Version voyage (bandes)',exos:[['Tirage vertical pronation','3x Max'],['Développé pectoraux','3x Max'],['Rowing','3x Max'],['Pompes élastique','3x Max']],rest:'2 min entre séries / 3 min entre exercices'},
    'BE':{label:'Séance B — Élastique',sub:'Version voyage (bandes)',exos:[['Pompes élastique','3x Max'],['Rowing','3x Max'],['Développé pectoraux','3x Max'],['Tirage vertical supination','3x Max']],rest:'2 min entre séries / 3 min entre exercices'},
  };

  const days=[
    {day:'Lundi',type:'Haut',seance:'A ou B',note:'Alterner : A → B → A → B...'},
    {day:'Mardi',type:'Core',exos:[['Ab Wheel Rollout','3x Max'],['Gainage latéral','4x1\' (2/côté)'],['Relevés de jambes','3x15']],rest:'1 min entre séries / 2 min entre exercices'},
    {day:'Mercredi',type:'Haut',seance:'A ou B',note:'Toujours l\'inverse du Lundi'},
    {day:'Jeudi',type:'Core',exos:[['Ab Wheel Rollout','3x Max'],['Gainage latéral','4x1\' (2/côté)'],['Relevés de jambes','3x15']],rest:'1 min entre séries / 2 min entre exercices'},
    {day:'Vendredi',type:'Haut',seance:'A ou B',note:'Toujours l\'inverse du Mercredi'},
    {day:'Samedi',type:'Core intensif',exos:[['Ab Wheel Rollout','5x Max'],['Touches d\'épaules en planche','3x15'],['Relevés de jambes','3x20'],['Gainage latéral','4x1\' (2/côté)']],rest:'45 sec entre séries / 2 min entre exercices'},
    {day:'Dimanche',type:'Repos',exos:null,rest:null},
  ];

  // Section planning semaine
  const planTitle=document.createElement('div');planTitle.className='prog-title';planTitle.textContent='Planning semaine';
  c.appendChild(planTitle);

  days.forEach(d=>{
    const card=document.createElement('div');card.className='prog-card';
    const hdr=document.createElement('div');hdr.className='prog-day-hdr';
    hdr.innerHTML='<span class="prog-day-label">'+d.day+'</span><span class="prog-day-type">'+d.type+'</span>';
    card.appendChild(hdr);

    if(d.seance){
      const alt=document.createElement('div');alt.className='prog-alt';alt.textContent=d.note;
      card.appendChild(alt);
    } else if(d.exos){
      d.exos.forEach((e,i)=>{
        const row=document.createElement('div');row.className='prog-exo';
        row.innerHTML='<span class="prog-exo-num">'+(i+1)+'.</span><span class="prog-exo-name">'+e[0]+'</span><span class="prog-exo-sets">'+e[1]+'</span>';
        card.appendChild(row);
      });
      if(d.rest){const r=document.createElement('div');r.className='prog-rest';r.textContent='⏱ '+d.rest;card.appendChild(r);}
    } else {
      const em=document.createElement('div');em.style.cssText='font-size:12px;color:var(--mu);';em.textContent='Repos total / étirements légers';card.appendChild(em);
    }
    c.appendChild(card);
  });

  // Section séances type
  const seanceTitle=document.createElement('div');seanceTitle.className='prog-title';seanceTitle.style.marginTop='18px';seanceTitle.textContent='Descriptif séances haut';
  c.appendChild(seanceTitle);

  const altNote=document.createElement('div');altNote.className='prog-alt';altNote.textContent='Ordre : A → B → A → B... (toujours l\'inverse de la séance haut précédente)';
  c.appendChild(altNote);

  Object.values(seances).forEach(s=>{
    const card=document.createElement('div');card.className='prog-card';
    const title=document.createElement('div');title.className='prog-card-title';title.textContent=s.label+' — '+s.sub;
    card.appendChild(title);
    s.exos.forEach((e,i)=>{
      const row=document.createElement('div');row.className='prog-exo';
      row.innerHTML='<span class="prog-exo-num">'+(i+1)+'.</span><span class="prog-exo-name">'+e[0]+'</span><span class="prog-exo-sets">'+e[1]+'</span>';
      card.appendChild(row);
    });
    const r=document.createElement('div');r.className='prog-rest';r.textContent='⏱ '+s.rest;card.appendChild(r);
    c.appendChild(card);
  });

  // Custom templates section
  if(Object.keys(customTemplates).length>0){
    const customTitle=document.createElement('div');customTitle.className='prog-title';customTitle.style.marginTop='18px';customTitle.textContent='Séances personnalisées';
    c.appendChild(customTitle);
    Object.keys(customTemplates).forEach(k=>{
      const name=k.replace('custom:','');
      const card=document.createElement('div');card.className='prog-card';
      const titleEl=document.createElement('div');titleEl.className='prog-card-title';
      const delBtn=document.createElement('button');delBtn.textContent='✕';delBtn.style.cssText='float:right;background:transparent;border:none;color:var(--mu);cursor:pointer;font-size:12px;';
      delBtn.onclick=()=>{if(confirm('Supprimer "'+name+'" ?')){delete customTemplates[k];saveLocal();renderProg();}};
      titleEl.textContent=name;titleEl.appendChild(delBtn);
      card.appendChild(titleEl);
      customTemplates[k].forEach(([exoName,nb],i)=>{
        const row=document.createElement('div');row.className='prog-exo';
        row.innerHTML='<span class="prog-exo-num">'+(i+1)+'.</span><span class="prog-exo-name">'+esc(exoName)+'</span><span class="prog-exo-sets">'+nb+'x séries</span>';
        card.appendChild(row);
      });
      c.appendChild(card);
    });
  }
}

loadLocal();
render();
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&tRunning&&tStartTime){
    const elapsed=Math.floor((Date.now()-tStartTime)/1000);
    tSecs=Math.max(0,tStartSecs-elapsed);
    updT();
    if(tSecs<=0){beep();stopTimer();}
  }
});
document.addEventListener('click',function(e){var ar=document.querySelector('.add-exo');if(ar&&!ar.contains(e.target))hideDD();});
document.addEventListener('touchstart',function(e){var ar=document.querySelector('.add-exo');if(ar&&!ar.contains(e.target))hideDD();},{passive:true});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
